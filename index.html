<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Track</title>
    <link rel="icon" href="./assets/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>  
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo"><img src="./assets/logo.png" alt="Logo"></a>
            <h1>Money Track</h1>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#" class="add-expense-link">Add Expense</a></li>
            </ul>
        </nav>
    </header> 

    <section class="content">
        
        <div class="total-expense">
            <h3>Total Expenses</h3>
            <h4 id="current-total">₹0.00</h4>
        </div>

        <div class="balance">
            <h3>Balance</h3>
            <h4 id="current-balance">₹0.00</h4>
        </div>

        <div class="monthly-income">
            <h3>Monthly Income</h3>
            <h4>₹50,000</h4>
        </div>

        <div class="credit-bill">
            <h3>Credit Card Bill</h3>
            <h4 id="total-credit">₹0.00</h4>
        </div>

    </section>

    <section class="expense-details-section">
    
    <div class="expense-nav">  
        <h2>Expense Details</h2>  
        <a href="#" class="add-expense-link">Add Expense</a>
        <a href="#">Edit</a>
    </div>
    

    <table class="expense-table">
        <thead>
            <th>Date</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Payment type</th>
        </thead>
        <br>

        <tbody id="expense-table-body">

        </tbody>


    </table>

    <form action="" class="expense-form" id="expense-form">

    <button id="closeFormBtn" class="close-btn">&times;</button>

        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required><br>
        </div>

        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" required><br>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="Food">Food</option>
                <option value="Shopping">Shopping</option>
                <option value="Rent">Rent</option>
            </select>
        </div>

        <div class="form-group-1">
            <label for="payment_type">Payment type:</label>
            <select id="payment_type" name="payment_type" required>
                <option value="Cash">Cash</option>
                <option value="Credit card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
            </select>
        </div>

        <button  class="add-btn" type="submit" value="Add_Expense"> Add </button>
    </form>

    </section>
</body>

<footer class="footer">
    <p>&copy; 2026 Money Track. All rights reserved.</p>
</footer>

</html>
